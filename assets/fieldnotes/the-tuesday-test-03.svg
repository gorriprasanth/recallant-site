<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>testpack explanation</title><rect width="1000" height="320" fill="#f1eee5"/><rect x="30" y="25" width="455" height="125" fill="#ffffff"/><rect x="30" y="25" width="7" height="125" fill="#236a75"/><text x="52" y="60" font-family="Arial" font-size="18" font-weight="bold" fill="#236a75">NORMAL</text><text x="52" y="97" font-family="Arial" font-size="23" font-weight="normal" fill="#20302d">Complete and consistent</text><rect x="515" y="25" width="455" height="125" fill="#ffffff"/><rect x="515" y="25" width="7" height="125" fill="#236a75"/><text x="537" y="60" font-family="Arial" font-size="18" font-weight="bold" fill="#236a75">MISSING</text><text x="537" y="97" font-family="Arial" font-size="23" font-weight="normal" fill="#20302d">Ask for the absent fact</text><rect x="30" y="170" width="455" height="125" fill="#ffffff"/><rect x="30" y="170" width="7" height="125" fill="#236a75"/><text x="52" y="205" font-family="Arial" font-size="18" font-weight="bold" fill="#236a75">CONFLICT</text><text x="52" y="242" font-family="Arial" font-size="23" font-weight="normal" fill="#20302d">Flag the contradiction</text><rect x="515" y="170" width="455" height="125" fill="#ffffff"/><rect x="515" y="170" width="7" height="125" fill="#236a75"/><text x="537" y="205" font-family="Arial" font-size="18" font-weight="bold" fill="#236a75">EMPTY</text><text x="537" y="242" font-family="Arial" font-size="23" font-weight="normal" fill="#20302d">Invent nothing</text></svg>