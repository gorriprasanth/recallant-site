<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>ledger explanation</title><rect width="1000" height="320" fill="#f1eee5"/><text x="28" y="35" font-family="Arial" font-size="15" font-weight="bold" fill="#9b462d">CLAIM CHECK / INVENTED WORKSHOP EXAMPLE</text><path d="M28 118H970" stroke="#b5beb6"/><text x="28" y="70" font-family="Arial" font-size="19" font-weight="normal" fill="#20302d">Arrives in 3 days</text><text x="290" y="70" font-family="Arial" font-size="16" font-weight="normal" fill="#20302d">Dispatch within 3 working days</text><text x="665" y="70" font-family="Arial" font-size="17" font-weight="normal" fill="#20302d">Narrower</text><text x="840" y="70" font-family="Arial" font-size="17" font-weight="bold" fill="#9b462d">REWRITE</text><path d="M28 193H970" stroke="#b5beb6"/><text x="28" y="145" font-family="Arial" font-size="19" font-weight="normal" fill="#20302d">Assembly included</text><text x="290" y="145" font-family="Arial" font-size="16" font-weight="normal" fill="#20302d">No verified service record</text><text x="665" y="145" font-family="Arial" font-size="17" font-weight="normal" fill="#20302d">Unavailable</text><text x="840" y="145" font-family="Arial" font-size="17" font-weight="bold" fill="#9b462d">HOLD</text><path d="M28 268H970" stroke="#b5beb6"/><text x="28" y="220" font-family="Arial" font-size="19" font-weight="normal" fill="#20302d">Lifetime warranty</text><text x="290" y="220" font-family="Arial" font-size="16" font-weight="normal" fill="#20302d">Defined duration and exclusions</text><text x="665" y="220" font-family="Arial" font-size="17" font-weight="normal" fill="#20302d">Contradicted</text><text x="840" y="220" font-family="Arial" font-size="17" font-weight="bold" fill="#9b462d">CORRECT</text><text x="28" y="302" font-family="Arial" font-size="15" font-weight="normal" fill="#20302d">Evidence status and publication action are recorded separately.</text></svg>