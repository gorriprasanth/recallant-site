<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>beforeafter explanation</title><rect width="1000" height="320" fill="#f1eee5"/><rect x="25" y="25" width="590" height="260" fill="#fffdf7"/><text x="50" y="65" font-family="Arial" font-size="17" font-weight="bold" fill="#9b462d">BEFORE</text><text x="50" y="110" font-family="Arial" font-size="28" font-weight="normal" fill="#20302d">Free assembly. Three-day</text><text x="50" y="143" font-family="Arial" font-size="28" font-weight="normal" fill="#20302d">delivery.</text><path d="M60 225H555" stroke="#9b462d" stroke-width="3"/><text x="660" y="70" font-family="Arial" font-size="17" font-weight="bold" fill="#9b462d">CHECK</text><text x="660" y="102" font-family="Arial" font-size="20" font-weight="normal" fill="#20302d">Which record supports</text><text x="660" y="128" font-family="Arial" font-size="20" font-weight="normal" fill="#20302d">each promise?</text><text x="660" y="195" font-family="Arial" font-size="17" font-weight="bold" fill="#9b462d">AFTER</text><text x="660" y="227" font-family="Arial" font-size="20" font-weight="normal" fill="#20302d">Confirm timing and</text><text x="660" y="253" font-family="Arial" font-size="20" font-weight="normal" fill="#20302d">assembly for the address.</text></svg>