<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>report explanation</title><rect width="1000" height="320" fill="#f1eee5"/><text x="30" y="50.0" font-family="Arial" font-size="20" font-weight="bold" fill="#806000">IMPRESSION</text><text x="290" y="50.0" font-family="Arial" font-size="24" font-weight="normal" fill="#20302d">A reported visibility observation</text><path d="M30 70.0H950" stroke="#bcc3ba"/><text x="30" y="123.33333333333333" font-family="Arial" font-size="20" font-weight="bold" fill="#806000">CLICK</text><text x="290" y="123.33333333333333" font-family="Arial" font-size="24" font-weight="normal" fill="#20302d">A different interaction</text><path d="M30 143.33333333333331H950" stroke="#bcc3ba"/><text x="30" y="196.66666666666666" font-family="Arial" font-size="20" font-weight="bold" fill="#806000">ENQUIRY</text><text x="290" y="196.66666666666666" font-family="Arial" font-size="24" font-weight="normal" fill="#20302d">A business record, not an impression</text><path d="M30 216.66666666666666H950" stroke="#bcc3ba"/><text x="30" y="302" font-family="Arial" font-size="15" font-weight="normal" fill="#20302d">Separate observations. No automatic progression or attribution is implied.</text></svg>