<!doctype html>

<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--night); }
  .og { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; color: var(--snow);
        background: radial-gradient(60% 70% at 88% 92%, rgba(92,202,168,.20), transparent 70%), radial-gradient(40% 40% at 10% 0%, rgba(226,244,237,.05), transparent 70%), var(--night);
        display: grid; grid-template-columns: 1fr 440px; gap: 48px; align-items: center; font-family: var(--font-sans); }
  .og .brand { font-size: 30px; gap: 14px; color: var(--snow); }
  .og .brand__mark { width: 44px; height: 44px; }
  .og .brand__mark .m-bg { fill: var(--snow); } .og .brand__mark .m-r { fill: var(--night); }
  .og h1 { margin: 34px 0 0; font-size: 104px; line-height: .95; letter-spacing: -.055em; font-weight: 700; }
  .og h1 .dot { color: var(--mint); }
  .og .sub { margin-top: 26px; font-size: 27px; line-height: 1.35; color: var(--snow-2); letter-spacing: -.015em; max-width: 600px; }
  .og .url { margin-top: 34px; font-family: var(--font-mono); font-size: 19px; color: var(--snow-3); letter-spacing: .02em; }
  .ogc { border-radius: 22px; background: linear-gradient(180deg, rgba(226,244,237,.05), rgba(226,244,237,0) 120px), var(--night-2);
          border: 1px solid var(--night-line-2); box-shadow: 0 40px 100px -40px rgba(0,0,0,.9), 0 0 100px -30px rgba(92,202,168,.35); overflow: hidden; }
  .ogc__bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--night-line); font-size: 15px; color: var(--snow); font-weight: 600; }
  .ogc__bar span:last-child { font-family: var(--font-mono); font-size: 13px; color: var(--snow-3); font-weight: 500; }
  .ogc__body { padding: 20px 22px 22px; display: grid; gap: 14px; }
  .ogc__q { font-size: 21px; line-height: 1.25; letter-spacing: -.025em; font-weight: 650; }
  .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--snow-3); padding-bottom: 6px; border-bottom: 1px solid var(--night-line); }
  .r { display: grid; grid-template-columns: 1fr auto 40px; align-items: center; gap: 12px; font-size: 18px; }
  .r .n { font-family: var(--font-mono); font-size: 14px; color: var(--snow-2); text-align: right; }
  .r.z { color: var(--snow-3); }
  .pips i { width: 9px; height: 19px; background: rgba(226,244,237,.13); }
  .pips i.on { background: var(--mint); }
  .first { display: flex; align-items: center; gap: 10px; }
  .tag { font-family: var(--font-mono); font-size: 12px; font-weight: 700; background: var(--mint); color: var(--night); border-radius: 6px; padding: 3px 8px; }
  .ogfacts { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .ogfacts span { font-size: 19px; padding: 9px 16px; border-radius: 999px; background: rgba(226,244,237,.07); color: var(--snow-2); }
  .ogfacts b { color: var(--snow); font-weight: 650; }
  .kick { font-family: var(--font-mono); font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--mint); margin-top: 34px; }
  .og--study h1 { font-size: 76px; margin-top: 14px; line-height: 1; letter-spacing: -.05em; }
  .sov2 { display: grid; gap: 12px; }
  .sov2 .row { display: grid; grid-template-columns: 112px 1fr 58px; align-items: center; gap: 12px; font-size: 17px; }
  .sov2 .t { position: relative; height: 22px; }
  .sov2 .t::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--night-line); }
  .sov2 .b { position: absolute; left: 0; top: 50%; height: 14px; margin-top: -7px; border-radius: 0 4px 4px 0; background: var(--mint); }
  .sov2 .w { position: absolute; top: 50%; height: 2px; margin-top: 10px; background: var(--snow-3); }
  .sov2 .v { font-family: var(--font-mono); font-size: 14px; color: var(--snow-2); text-align: right; }
  .note { font-family: var(--font-mono); font-size: 12px; color: var(--snow-3); margin-top: 4px; }
</style>
</head>
